<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Netlify Chat</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<meta name="application-name" content="Chat">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chat">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<script>
  // Apply the last-used look straight away so there's no flash of the wrong theme while the page loads.
  try {
    const p = JSON.parse(localStorage.getItem("look") || localStorage.getItem("prefs") || "{}"), r = document.documentElement;
    if (p.theme === "light" || p.theme === "dark" || p.theme === "custom") r.dataset.theme = p.theme;
    if (p.mode === "light" || p.mode === "dark") r.dataset.mode = p.mode;
    if (p.accent) r.dataset.accent = p.accent;
    if (p.wallpaper) r.dataset.wallpaper = p.wallpaper;
    if (typeof p.style === "string" && /^[-\w\s:#;,.()%]*$/.test(p.style)) r.setAttribute("style", p.style); // custom colours
  } catch {}
</script>
<style>
  /* Light is the base. Dark applies when the system is dark (unless light is forced) or when dark is forced. */
  :root {
    color-scheme: light dark;
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1d1b; --muted: #75736b;
    --line: #e4e2da; --theirs: #eceae3; --accent-ink: #ffffff; --mine-ink: #fff;
    /* accent colors come in a light (-l) and dark (-d) variant; green is the default */
    --accent-l: #2f6f5e; --mine-l: #2f6f5e; --accent-d: #5aa892; --mine-d: #3b7f6c;
    --accent: var(--accent-l); --mine: var(--mine-l);
    --wp: none; --wp-size: auto;
    --bad: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151614; --panel: #1e201d; --ink: #ecebe5; --muted: #8f8d84;
      --line: #2e302b; --theirs: #2a2c27; --accent-ink: #10130f;
      --accent: var(--accent-d); --mine: var(--mine-d); --bad: #ff8f84;
    }
    :root:not([data-theme="light"]) .swatch { background: var(--accent-d); }
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #151614; --panel: #1e201d; --ink: #ecebe5; --muted: #8f8d84;
    --line: #2e302b; --theirs: #2a2c27; --accent-ink: #10130f;
    --accent: var(--accent-d); --mine: var(--mine-d); --bad: #ff8f84;
  }
  :root[data-theme="dark"] .swatch { background: var(--accent-d); }

  /* accent palettes (also matched by the swatches in Settings, which carry data-accent themselves) */
  [data-accent="green"]  { --accent-l: #2f6f5e; --mine-l: #2f6f5e; --accent-d: #5aa892; --mine-d: #3b7f6c; }
  [data-accent="blue"]   { --accent-l: #2563a8; --mine-l: #2563a8; --accent-d: #6aa6e8; --mine-d: #2f6fb8; }
  [data-accent="purple"] { --accent-l: #6d4aa8; --mine-l: #6d4aa8; --accent-d: #a68ae0; --mine-d: #7a58bd; }
  [data-accent="rose"]   { --accent-l: #b03a58; --mine-l: #b03a58; --accent-d: #e8829c; --mine-d: #bf4a68; }
  [data-accent="orange"] { --accent-l: #a65216; --mine-l: #a65216; --accent-d: #e8a063; --mine-d: #a85a1f; }
  [data-accent="slate"]  { --accent-l: #46546a; --mine-l: #46546a; --accent-d: #9aaac4; --mine-d: #55657f; }

  /* chat wallpapers (also drawn on the preview tiles in Settings) */
  :root[data-wallpaper="tint"], .wp-tile[data-wp="tint"] {
    --wp: linear-gradient(color-mix(in srgb, var(--accent) 10%, transparent), color-mix(in srgb, var(--accent) 10%, transparent));
    --wp-size: auto;
  }
  :root[data-wallpaper="dots"], .wp-tile[data-wp="dots"] {
    --wp: radial-gradient(color-mix(in srgb, var(--ink) 16%, transparent) 1.3px, transparent 1.7px);
    --wp-size: 18px 18px;
  }
  :root[data-wallpaper="grid"], .wp-tile[data-wp="grid"] {
    --wp: linear-gradient(color-mix(in srgb, var(--ink) 8%, transparent) 1px, transparent 1px),
          linear-gradient(90deg, color-mix(in srgb, var(--ink) 8%, transparent) 1px, transparent 1px);
    --wp-size: 24px 24px;
  }
  :root[data-wallpaper="stripes"], .wp-tile[data-wp="stripes"] {
    --wp: repeating-linear-gradient(45deg, color-mix(in srgb, var(--ink) 6%, transparent) 0 10px, transparent 10px 20px);
    --wp-size: auto;
  }
  .wp-tile[data-wp="none"] { --wp: none; } /* the preview must not inherit the page's current wallpaper */
  #messages, .wp-tile { background-color: var(--bg); background-image: var(--wp); background-size: var(--wp-size); }

  /* settings controls */
  .seg-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-start; }
  .seg { padding: 6px 14px; border-radius: 8px; border: 1px solid var(--line); background: transparent; }
  .seg[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); font-weight: 600; }
  .swatch { width: 34px; height: 34px; padding: 0; border-radius: 50%; border: 0; background: var(--accent-l); outline: 1px solid var(--line); }
  .swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--ink); }
  .wp-cell { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); background: none; border: 0; padding: 0; }
  .wp-tile { display: block; width: 60px; height: 46px; border-radius: 8px; border: 1px solid var(--line); }
  .wp-cell[aria-pressed="true"] { color: var(--ink); font-weight: 600; }
  .wp-cell[aria-pressed="true"] .wp-tile { box-shadow: 0 0 0 2px var(--accent); }
  .seg-row + .sub-note { margin-top: 14px; }
  :root[data-theme="custom"][data-mode="light"] .swatch { background: var(--accent-l); }
  :root[data-theme="custom"][data-mode="dark"] .swatch { background: var(--accent-d); }
  .color-editor { margin-top: 12px; }
  .color-row { display: flex; gap: 8px; align-items: center; }
  .color-row input[type=color] { flex: none; width: 42px; height: 38px; padding: 2px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); cursor: pointer; }
  .color-row input[type=text] { flex: 1; min-width: 0; }
  .color-msg { margin-top: 6px; font-size: 12px; line-height: 1.5; color: var(--muted); white-space: pre-line; }
  .color-msg.bad { color: var(--bad); }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 15px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; background: var(--bg); color: var(--ink); }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .hidden { display: none !important; }

  /* auth */
  #auth { min-height: 100%; display: grid; place-items: center; padding: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 24px; width: 100%; max-width: 360px; }
  .card h1 { margin: 0 0 4px; font-size: 22px; }
  .card p { margin: 0 0 16px; color: var(--muted); }
  .field { display: block; margin-bottom: 12px; }
  .field span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input[type=text], input[type=password] {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg);
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 10px 14px; font-weight: 600; }
  .btn.block { width: 100%; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); font-weight: 500; }
  .link { background: none; border: 0; color: var(--accent); padding: 0; text-decoration: underline; }
  .err { color: #c0392b; min-height: 20px; margin: 8px 0 0; font-size: 13px; }

  /* app */
  #app { height: 100%; display: grid; grid-template-columns: 300px 1fr; padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
  aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .side-head { padding: 14px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .side-head strong { font-size: 16px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side-actions { display: flex; gap: 6px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .side-actions .btn { flex: 1; padding: 8px 10px; font-size: 14px; }
  #chatList { overflow-y: auto; flex: 1; }
  .chat-row { padding: 12px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .chat-row:hover { background: var(--bg); }
  .chat-row.active { background: var(--theirs); }
  .chat-row .name { font-weight: 600; display: flex; gap: 6px; align-items: center; }
  .sys { align-self: center; max-width: 85%; text-align: center; color: var(--muted); font-size: 12px; margin: 4px 0; padding: 2px 10px; border-radius: 10px; background: color-mix(in srgb, var(--bg) 88%, transparent); }
  .btn.danger { background: #c0392b; color: #fff; }
  .main-head .sub.typing { color: var(--accent); font-weight: 600; }
  .modal h3 { margin: 16px 0 6px; font-size: 14px; }
  .modal .sub-note { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  .chat-row .tag, .modal .tag { font-size: 11px; font-weight: 500; color: var(--muted); border: 1px solid var(--line); border-radius: 10px; padding: 0 6px; }
  .chat-row .prev { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-row.unread .prev { color: var(--ink); font-weight: 600; }
  .badge { margin-left: auto; min-width: 20px; padding: 0 7px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-size: 12px; font-weight: 700; text-align: center; line-height: 20px; }
  .empty { color: var(--muted); padding: 24px 14px; text-align: center; }

  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .main-head { padding: 14px 16px; background: var(--panel); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
  .main-head .back { display: none; }
  .main-head .title { font-weight: 600; }
  .main-head .sub { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
  .msg { max-width: min(75%, 520px); padding: 8px 12px; border-radius: 14px; background: var(--theirs); word-wrap: break-word; white-space: pre-wrap; align-self: flex-start; }
  .msg.mine { background: var(--mine); color: var(--mine-ink); align-self: flex-end; }
  .msg .who { font-size: 12px; font-weight: 600; color: var(--accent); margin-bottom: 2px; }
  .msg .time { font-size: 11px; opacity: .65; margin-top: 2px; display: flex; justify-content: flex-end; gap: 10px; }
  .msg .del { background: none; border: 0; padding: 0; color: inherit; font-size: 11px; text-decoration: underline; }
  .msg.deleted { font-style: italic; opacity: .6; }
  .day { align-self: center; margin: 12px 0 6px; padding: 3px 12px; border-radius: 10px; background: var(--theirs); color: var(--muted); font-size: 12px; font-weight: 600; }
  .placeholder { margin: auto; color: var(--muted); }
  form#composer { display: flex; gap: 8px; padding: 12px 12px max(12px, env(safe-area-inset-bottom)); background: var(--panel); border-top: 1px solid var(--line); }
  aside { padding-bottom: env(safe-area-inset-bottom); }
  .install-hint { color: var(--muted); font-size: 13px; margin: 6px 0 14px; }
  form#composer input { flex: 1; }

  /* photos */
  form#composer .attach { padding: 8px 12px; font-size: 18px; line-height: 1; }
  .msg .media { display: block; padding: 0; border: 0; background: rgba(128,128,128,.18); border-radius: 10px; overflow: hidden; max-width: 100%; cursor: zoom-in; color: inherit; }
  .msg .media img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .msg .media.broken { cursor: default; display: grid; place-items: center; min-height: 80px; width: 200px; font-size: 13px; font-style: italic; opacity: .75; }
  .msg .caption { margin-top: 6px; }
  main.dropping { outline: 3px dashed var(--accent); outline-offset: -6px; }
  .photo-preview { display: block; max-width: 100%; max-height: 240px; margin: 0 auto 12px; border-radius: 10px; }
  .photo-note { color: var(--muted); font-size: 13px; margin: 8px 0; min-height: 1.2em; }
  .photo-note.err { color: #c0392b; }
  .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin: 8px 0; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s; }
  .modal .row-end { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
  .lightbox { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.88); display: grid; place-items: center; padding: 12px; cursor: zoom-out; }
  .lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 4px; }
  .lightbox .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px; color: #fff; background: linear-gradient(transparent, rgba(0,0,0,.7)); text-align: center; white-space: pre-wrap; }
  .lightbox .x { position: absolute; top: 10px; right: 12px; background: rgba(255,255,255,.18); color: #fff; border: 0; border-radius: 20px; width: 36px; height: 36px; font-size: 20px; }

  /* modal */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: grid; place-items: center; padding: 16px; z-index: 10; }
  .modal { background: var(--panel); border-radius: 14px; border: 1px solid var(--line); padding: 20px; width: 100%; max-width: 380px; max-height: 90vh; overflow: auto; }
  .modal h2 { margin: 0 0 12px; font-size: 18px; }
  .results { margin: 8px 0; }
  .result { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .chip { background: var(--theirs); border-radius: 12px; padding: 2px 10px; font-size: 13px; }
  .chip button { background: none; border: 0; padding: 0 0 0 6px; color: var(--muted); }
  .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }

  @media (max-width: 720px) {
    #app { grid-template-columns: 1fr; }
    #app.in-chat aside { display: none; }
    #app:not(.in-chat) main { display: none; }
    .main-head .back { display: inline-block; }
  }
</style>
</head>
<body>

<!-- Auth -->
<div id="auth" class="hidden">
  <form class="card" id="authForm">
    <h1 id="authTitle">Welcome back</h1>
    <p id="authSub">Sign in to your chats.</p>
    <label class="field"><span>Username</span><input type="text" id="username" autocomplete="username" autocapitalize="none" required></label>
    <label class="field"><span>Password</span><input type="password" id="password" autocomplete="current-password" required></label>
    <button class="btn block" type="submit" id="authBtn">Sign in</button>
    <div class="err" id="authErr"></div>
    <p style="margin:8px 0 0"><span id="authSwitchText">No account?</span> <button type="button" class="link" id="authSwitch">Create one</button></p>
  </form>
</div>

<!-- App -->
<div id="app" class="hidden">
  <aside>
    <div class="side-head">
      <strong id="meName"></strong>
      <div style="display:flex;gap:6px;flex-shrink:0">
        <button class="btn ghost" id="settingsBtn" style="padding:6px 10px">Settings</button>
        <button class="btn ghost" id="logoutBtn" style="padding:6px 10px">Log out</button>
      </div>
    </div>
    <div class="side-actions">
      <button class="btn" id="newDm">New DM</button>
      <button class="btn" id="newGroup">New group</button>
    </div>
    <div id="chatList"></div>
  </aside>
  <main>
    <div class="main-head">
      <button class="btn ghost back" id="backBtn">&larr;</button>
      <div style="min-width:0">
        <div class="title" id="chatTitle">Select a chat</div>
        <div class="sub" id="chatSub"></div>
      </div>
      <button class="btn ghost hidden" id="infoBtn" style="margin-left:auto;padding:6px 12px">Members</button>
    </div>
    <div id="messages"><div class="placeholder">Pick a chat or start a new one.</div></div>
    <form id="composer" class="hidden">
      <button class="btn ghost attach" id="attachBtn" type="button" aria-label="Send a photo" title="Send a photo">&#128247;</button>
      <input type="file" id="fileInput" class="hidden" accept="image/*">
      <input type="text" id="text" placeholder="Type a message" autocomplete="off" maxlength="2000">
      <button class="btn" type="submit">Send</button>
    </form>
  </main>
</div>

<div id="modalRoot"></div>

<script>
const $ = (id) => document.getElementById(id);
const DEFAULT_PREFS = { theme: "system", accent: "green", wallpaper: "none", customAccent: null, customTheme: null };
const state = { me: null, chats: [], active: null, lastKey: null, seen: new Set(), els: new Map(), mode: "login",
  maxTs: 0, readSent: new Map(), lastDay: "", epoch: 0, typing: [], typingSig: "", lastPing: 0,
  prefs: { ...DEFAULT_PREFS },
  version: "", idle: 0, syncing: null, again: false, timer: null };

async function api(path, opts = {}) {
  const res = await fetch("/api" + path, {
    method: opts.method || "GET",
    headers: opts.body ? { "Content-Type": "application/json" } : undefined,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
    credentials: "same-origin",
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const e = new Error(data.error || "Request failed");
    e.status = res.status;
    throw e;
  }
  return data;
}

/* ---------- colour maths ---------- */
const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));
const hexToRgb = (h) => ({ r: parseInt(h.slice(1, 3), 16), g: parseInt(h.slice(3, 5), 16), b: parseInt(h.slice(5, 7), 16) });
const toHex = (c) => "#" + [c.r, c.g, c.b].map((v) => clamp(Math.round(v), 0, 255).toString(16).padStart(2, "0")).join("");

function rgbToHsl({ r, g, b }) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min, l = (max + min) / 2;
  let h = 0, s = 0;
  if (d) {
    s = d / (1 - Math.abs(2 * l - 1));
    if (max === r) h = ((g - b) / d) % 6; else if (max === g) h = (b - r) / d + 2; else h = (r - g) / d + 4;
    h *= 60;
    if (h < 0) h += 360;
  }
  return { h, s, l };
}
// Returns whole-number channels, so every contrast check below is made on the exact colour that gets painted.
function hslToRgb({ h, s, l }) {
  h = ((h % 360) + 360) % 360;
  const c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs(((h / 60) % 2) - 1)), m = l - c / 2;
  const [r, g, b] = h < 60 ? [c, x, 0] : h < 120 ? [x, c, 0] : h < 180 ? [0, c, x] : h < 240 ? [0, x, c] : h < 300 ? [x, 0, c] : [c, 0, x];
  return { r: Math.round((r + m) * 255), g: Math.round((g + m) * 255), b: Math.round((b + m) * 255) };
}
const lin = (v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; };
const relLum = (c) => 0.2126 * lin(c.r) + 0.7152 * lin(c.g) + 0.0722 * lin(c.b);
const contrast = (a, b) => { const x = relLum(a), y = relLum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
const mix = (a, b, t) => ({ r: Math.round(a.r + (b.r - a.r) * t), g: Math.round(a.g + (b.g - a.g) * t), b: Math.round(a.b + (b.b - a.b) * t) });

/* ---------- colour input: hex, rgb(), hsl() ---------- */
const COLOR_HELP = "Not a valid color. Try #2f6f5e, rgb(47, 111, 94) or hsl(164, 41%, 31%).";
const ALPHA_HELP = "Transparency isn't supported. Use a solid color.";

// Accepts #rgb, #rrggbb (with or without #), rgb()/rgba() and hsl()/hsla() written with commas or spaces,
// numbers or percentages, or the bare numbers ("47, 111, 94" or "163, 40%, 31%").
// Returns { rgb: {r,g,b} } or { error: "..." }.
function parseColor(input) {
  const s = String(input).trim().toLowerCase();
  let m = s.match(/^#?([0-9a-f]{3}|[0-9a-f]{6})$/);
  if (m) {
    let h = m[1];
    if (h.length === 3) h = h.replace(/./g, (c) => c + c);
    return { rgb: hexToRgb("#" + h) };
  }
  if (/^#([0-9a-f]{4}|[0-9a-f]{8})$/.test(s)) return { error: ALPHA_HELP };

  let kind = null, body = s;
  const fn = s.match(/^(rgb|rgba|hsl|hsla)\(([^()]*)\)$/);
  if (fn) { kind = fn[1].slice(0, 3); body = fn[2]; }
  if (/[,\/]\s*[,\/]/.test(body) || /^\s*[,\/]|[,\/]\s*$/.test(body)) return { error: COLOR_HELP }; // doubled or dangling separators
  const t = body.trim().split(/\s*[,\/]\s*|\s+/).filter(Boolean);
  const num = /^[-+]?(\d+\.?\d*|\.\d+)(%|deg)?$/;
  if (t.length < 3 || t.length > 4 || !t.every((x) => num.test(x))) return { error: COLOR_HELP };
  if (t.length === 4) {
    const alpha = parseFloat(t[3]) / (t[3].endsWith("%") ? 100 : 1);
    if (alpha !== 1) return { error: ALPHA_HELP };
  }
  if (!kind) kind = t[0].endsWith("%") ? "rgb" : t[1].endsWith("%") && t[2].endsWith("%") ? "hsl" : "rgb";

  if (kind === "rgb") {
    const head = t.slice(0, 3);
    const pct = head[0].endsWith("%");
    if (head.some((x) => x.endsWith("deg") || x.endsWith("%") !== pct)) return { error: COLOR_HELP };
    const v = head.map((x) => (pct ? (parseFloat(x) * 255) / 100 : parseFloat(x))); // *255/100, not *2.55: 50% must give 127.5, not 127.49999
    if (v.some((x) => x < 0 || x > 255.0001)) return { error: "RGB values go from 0 to 255 (or 0% to 100%)." };
    return { rgb: { r: Math.round(v[0]), g: Math.round(v[1]), b: Math.round(v[2]) } };
  }
  if (t[0].endsWith("%") || t[1].endsWith("deg") || t[2].endsWith("deg")) return { error: COLOR_HELP };
  const sat = parseFloat(t[1]), lig = parseFloat(t[2]);
  if (sat < 0 || sat > 100 || lig < 0 || lig > 100) return { error: "Saturation and lightness go from 0% to 100%." };
  return { rgb: hslToRgb({ h: parseFloat(t[0]), s: sat / 100, l: lig / 100 }) };
}

// "HEX #2f6f5e · RGB 47, 111, 94 · HSL 164°, 41%, 31%"
function describeColor(rgb) {
  const h = rgbToHsl(rgb);
  return `HEX ${toHex(rgb)}  ·  RGB ${rgb.r}, ${rgb.g}, ${rgb.b}  ·  HSL ${Math.round(h.h)}°, ${Math.round(h.s * 100)}%, ${Math.round(h.l * 100)}%`;
}

/* ---------- turning one or two chosen colours into a readable palette ---------- */
// These mirror the built-in light and dark palettes in the CSS above (--bg, --panel, --theirs).
const LIGHT_SURFACES = [{ r: 246, g: 245, b: 241 }, { r: 255, g: 255, b: 255 }, { r: 236, g: 234, b: 227 }];
const DARK_SURFACES = [{ r: 21, g: 22, b: 20 }, { r: 30, g: 32, b: 29 }, { r: 42, g: 44, b: 39 }];

// Build a whole theme from ONE background colour: text, panels, borders. Any colour works: if the
// chosen shade can't carry readable text (mid-greys, pure red...), it is moved along its lightness
// until text reaches 7:1 contrast, in whichever direction needs the smaller change.
function deriveTheme(hex) {
  const orig = hexToRgb(hex), white = { r: 255, g: 255, b: 255 };
  const INK_ON_DARK = { r: 236, g: 235, b: 229 }, INK_ON_LIGHT = { r: 29, g: 29, b: 27 };
  const push = (dark) => {
    const ink = dark ? INK_ON_DARK : INK_ON_LIGHT;
    const hsl = rgbToHsl(orig);
    let bg = orig, steps = 0;
    while (contrast(ink, bg) < 7 && steps < 220) {
      steps++;
      hsl.l = clamp(hsl.l + (dark ? -0.005 : 0.005), 0, 1);
      bg = hslToRgb(hsl);
    }
    return { dark, ink, bg, steps, ok: contrast(ink, bg) >= 7 };
  };
  const natural = relLum(orig) < 0.179; // below this, light text beats dark text
  const a = push(natural), b = push(!natural);
  const best = a.ok && (!b.ok || a.steps <= b.steps) ? a : b;
  const { dark, ink, bg } = best;
  const panel = dark ? mix(bg, white, 0.06) : mix(bg, white, 0.55);
  const theirs = mix(bg, ink, 0.08), line = mix(bg, ink, 0.14);
  let muted = ink;
  for (let t = 0.45; t <= 0.95; t += 0.02) {
    const c = mix(bg, ink, t);
    if ([bg, panel, theirs].every((surface) => contrast(c, surface) >= 4.5)) { muted = c; break; }
  }
  return { mode: dark ? "dark" : "light", bg, panel, theirs, line, ink, muted, adjusted: toHex(bg) !== toHex(orig) };
}

// Make an accent usable on the given surfaces: readable as text on all of them, readable as a button
// (white text on light themes, near-black on dark ones), and a message bubble that carries white text.
function accentFor(base, mode, surfaces) {
  const inkOn = mode === "dark" ? { r: 16, g: 19, b: 15 } : { r: 255, g: 255, b: 255 };
  const white = { r: 255, g: 255, b: 255 };
  const fine = (c) => surfaces.every((surface) => contrast(c, surface) >= 4.5) && contrast(inkOn, c) >= 4.5;
  let hsl = rgbToHsl(base), accent = base, i = 0;
  while (!fine(accent) && i++ < 220) { hsl.l = clamp(hsl.l + (mode === "dark" ? 0.005 : -0.005), 0, 1); accent = hslToRgb(hsl); }
  hsl = rgbToHsl(accent);
  let mine = accent;
  i = 0;
  while (contrast(white, mine) < 4.5 && i++ < 220) { hsl.l = clamp(hsl.l - 0.005, 0, 1); mine = hslToRgb(hsl); }
  return { accent, mine, inkOn };
}

// A built-in accent's colour for the given mode, read from the CSS palette above (single source of truth).
function presetColor(name, mode) {
  const probe = document.createElement("i");
  probe.dataset.accent = name;
  probe.style.display = "none";
  document.body.appendChild(probe);
  const v = getComputedStyle(probe).getPropertyValue(mode === "dark" ? "--accent-d" : "--accent-l").trim();
  probe.remove();
  return hexToRgb(v);
}

/* ---------- look & feel ---------- */
const MANAGED_VARS = ["--bg", "--panel", "--ink", "--muted", "--line", "--theirs", "--bad", "--accent-ink", "--accent", "--mine", "--accent-l", "--mine-l", "--accent-d", "--mine-d"];

// The phone's status bar / the app window's title bar takes the colour of the header.
function syncThemeColor() {
  try {
    const cs = getComputedStyle(document.documentElement);
    const c = cs.getPropertyValue("--panel").trim() || getComputedStyle(document.body).backgroundColor;
    document.querySelector('meta[name="theme-color"]').setAttribute("content", c);
  } catch {}
}
if (window.matchMedia) matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", syncThemeColor);

function applyPrefs(p) {
  state.prefs = { ...DEFAULT_PREFS, ...p };
  const P = state.prefs, r = document.documentElement, st = r.style;
  MANAGED_VARS.forEach((k) => st.removeProperty(k));
  st.removeProperty("color-scheme");
  delete r.dataset.mode;
  state.lookInfo = { themeShifted: null, accentNote: null };
  const customAccent = P.accent === "custom" && P.customAccent ? P.customAccent : null;

  if (P.theme === "custom" && P.customTheme) {
    // One chosen background colour -> a complete palette. Inline variables beat the stylesheet's.
    const d = deriveTheme(P.customTheme);
    r.dataset.theme = "custom";
    r.dataset.mode = d.mode;
    st.setProperty("color-scheme", d.mode);
    for (const [k, c] of [["--bg", d.bg], ["--panel", d.panel], ["--theirs", d.theirs], ["--line", d.line], ["--ink", d.ink], ["--muted", d.muted]]) st.setProperty(k, toHex(c));
    st.setProperty("--bad", d.mode === "dark" ? "#ff8f84" : "#b3261e");
    if (d.adjusted) state.lookInfo.themeShifted = toHex(d.bg);
    const base = customAccent ? hexToRgb(customAccent) : presetColor(P.accent === "custom" ? DEFAULT_PREFS.accent : P.accent, d.mode);
    const ac = accentFor(base, d.mode, [d.bg, d.panel, d.theirs]);
    st.setProperty("--accent", toHex(ac.accent));
    st.setProperty("--mine", toHex(ac.mine));
    st.setProperty("--accent-ink", toHex(ac.inkOn));
    if (customAccent && toHex(ac.accent) !== customAccent) state.lookInfo.accentNote = `Shade adjusted to ${toHex(ac.accent)} so text stays readable.`;
  } else {
    if (P.theme === "light" || P.theme === "dark") r.dataset.theme = P.theme; else delete r.dataset.theme;
    if (customAccent) {
      // Both variants are set, so it still follows the system's light/dark switch.
      const base = hexToRgb(customAccent);
      const L = accentFor(base, "light", LIGHT_SURFACES), D = accentFor(base, "dark", DARK_SURFACES);
      st.setProperty("--accent-l", toHex(L.accent)); st.setProperty("--mine-l", toHex(L.mine));
      st.setProperty("--accent-d", toHex(D.accent)); st.setProperty("--mine-d", toHex(D.mine));
      if (toHex(L.accent) !== customAccent || toHex(D.accent) !== customAccent) state.lookInfo.accentNote = "Shade adjusted slightly in light and/or dark mode so text stays readable.";
    }
  }
  r.dataset.accent = P.accent === "custom" && !customAccent ? DEFAULT_PREFS.accent : P.accent;
  r.dataset.wallpaper = P.wallpaper;
  syncThemeColor();
  try { // so the next page load can paint the right colours before the network answers
    localStorage.setItem("look", JSON.stringify({ theme: r.dataset.theme || null, mode: r.dataset.mode || null, accent: r.dataset.accent, wallpaper: r.dataset.wallpaper, style: r.getAttribute("style") || "" }));
  } catch {}
}

/* ---------- auth ---------- */
function setMode(mode) {
  state.mode = mode;
  const login = mode === "login";
  $("authTitle").textContent = login ? "Welcome back" : "Create account";
  $("authSub").textContent = login ? "Sign in to your chats." : "Pick a username and password (8+ chars).";
  $("authBtn").textContent = login ? "Sign in" : "Sign up";
  $("authSwitchText").textContent = login ? "No account?" : "Have an account?";
  $("authSwitch").textContent = login ? "Create one" : "Sign in";
  $("password").autocomplete = login ? "current-password" : "new-password";
  $("authErr").textContent = "";
}
$("authSwitch").onclick = () => setMode(state.mode === "login" ? "signup" : "login");
$("authForm").onsubmit = async (e) => {
  e.preventDefault();
  $("authErr").textContent = "";
  try {
    const r = await api(state.mode === "login" ? "/login" : "/signup", {
      method: "POST", body: { username: $("username").value, password: $("password").value },
    });
    $("password").value = "";
    startApp(r.username, r.prefs);
  } catch (err) { $("authErr").textContent = err.message; }
};
$("logoutBtn").onclick = async () => {
  await api("/logout", { method: "POST" }).catch(() => {});
  stopPolling();
  state.me = null; state.active = null;
  $("app").classList.add("hidden");
  $("auth").classList.remove("hidden");
  setMode("login");
};

/* ---------- app ---------- */
function startApp(username, prefs) {
  if (prefs) applyPrefs(prefs); // the account's saved look wins over whatever this browser had cached
  state.me = username;
  state.readSent = new Map();
  $("meName").textContent = "@" + username;
  $("auth").classList.add("hidden");
  $("app").classList.remove("hidden");
  closeChat();
  startPolling();
}

function chatLabel(c) {
  if (c.type === "group") return c.name;
  return "@" + c.members.find((m) => m !== state.me);
}

async function refreshChats() { await sync(true); }

// The chat you're looking at (in a visible tab) counts as read, so show 0 for it right away
// instead of waiting for the server round-trip.
function unreadOf(c) {
  const viewing = state.active && state.active.id === c.id && !document.hidden;
  return viewing ? 0 : c.unread || 0;
}

function renderChatList() {
  const box = $("chatList");
  box.textContent = "";
  const total = state.chats.reduce((n, c) => n + unreadOf(c), 0);
  document.title = total ? `(${total > 99 ? "99+" : total}) Netlify Chat` : "Netlify Chat";
  if (!state.chats.length) {
    const d = document.createElement("div");
    d.className = "empty";
    d.textContent = "No chats yet. Start a DM or create a group.";
    box.appendChild(d);
    return;
  }
  for (const c of state.chats) {
    const unread = unreadOf(c);
    const row = document.createElement("div");
    row.className = "chat-row" + (state.active && state.active.id === c.id ? " active" : "") + (unread ? " unread" : "");
    const name = document.createElement("div");
    name.className = "name";
    name.textContent = chatLabel(c);
    if (c.type === "group") {
      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = c.members.length + " members";
      name.appendChild(tag);
    }
    if (unread) {
      const badge = document.createElement("span");
      badge.className = "badge";
      badge.textContent = unread > 99 ? "99+" : String(unread);
      name.appendChild(badge);
    }
    const prev = document.createElement("div");
    prev.className = "prev";
    prev.textContent = c.preview || "No messages yet";
    row.append(name, prev);
    row.onclick = () => openChat(c);
    box.appendChild(row);
  }
}

function updateHeader() {
  const c = state.active;
  if (!c) return;
  $("chatTitle").textContent = chatLabel(c);
  const t = state.typing;
  let sub;
  if (t.length) {
    if (c.type !== "group") sub = "typing…";
    else if (t.length === 1) sub = `${t[0]} is typing…`;
    else if (t.length === 2) sub = `${t[0]} and ${t[1]} are typing…`;
    else sub = `${t.length} people are typing…`;
  } else {
    sub = c.type === "group" ? c.members.join(", ") : "Direct message";
  }
  $("chatSub").textContent = sub;
  $("chatSub").classList.toggle("typing", t.length > 0);
}

// What the server says about who is typing in the open chat.
function showTyping(list) {
  state.typing = list;
  state.typingSig = list.join(",");
  updateHeader();
  if (list.length) state.idle = 0; // stay on the fast poll while someone is typing
}

function openChat(c) {
  state.active = c;
  state.lastKey = null;
  state.seen = new Set(); state.els = new Map(); state.maxTs = 0; state.lastDay = "";
  state.typing = []; state.typingSig = ""; state.lastPing = 0;
  $("app").classList.add("in-chat");
  updateHeader();
  $("infoBtn").classList.toggle("hidden", c.type !== "group");
  $("composer").classList.remove("hidden");
  $("messages").textContent = "";
  renderChatList();
  poke();
  $("text").focus();
}

function closeChat(notice) {
  state.active = null;
  state.lastKey = null;
  state.seen = new Set(); state.els = new Map(); state.maxTs = 0; state.lastDay = "";
  state.typing = []; state.typingSig = ""; state.lastPing = 0;
  $("app").classList.remove("in-chat");
  $("chatTitle").textContent = "Select a chat";
  $("chatSub").textContent = "";
  $("infoBtn").classList.add("hidden");
  $("composer").classList.add("hidden");
  const p = document.createElement("div");
  p.className = "placeholder";
  p.textContent = typeof notice === "string" ? notice : "Pick a chat or start a new one.";
  $("messages").replaceChildren(p);
  renderChatList();
}
$("backBtn").onclick = () => closeChat();

function fmtTime(ts) {
  return new Date(ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}

const dayKey = (ts) => { const d = new Date(ts); return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; };

function dayLabel(ts) {
  const d = new Date(ts);
  const startOf = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate());
  const diff = Math.round((startOf(new Date()) - startOf(d)) / 86400000);
  if (diff === 0) return "Today";
  if (diff === 1) return "Yesterday";
  if (diff > 1 && diff < 7) return d.toLocaleDateString([], { weekday: "long" });
  return d.toLocaleDateString([], { day: "numeric", month: "long", year: "numeric" });
}

// "Today" must not go stale if the tab stays open past midnight.
function refreshDayLabels() {
  for (const el of document.querySelectorAll("#messages .day")) el.textContent = dayLabel(Number(el.dataset.ts));
}

function appendMessages(list) {
  const box = $("messages");
  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  let added = 0;
  for (const m of list) {
    // Skip messages already shown (concurrent fetches can return the same one twice)
    if (state.seen.has(m.key)) continue;
    state.seen.add(m.key);
    added++;
    const day = dayKey(m.ts);
    if (day !== state.lastDay) {
      const sep = document.createElement("div");
      sep.className = "day";
      sep.dataset.ts = String(m.ts);
      sep.textContent = dayLabel(m.ts);
      box.appendChild(sep);
      state.lastDay = day;
    }
    if (m.system) { // "alice added dave": a centered notice, not a bubble
      const s = document.createElement("div");
      s.className = "sys";
      s.textContent = m.text;
      box.appendChild(s);
      if (!state.lastKey || m.key > state.lastKey) state.lastKey = m.key;
      if (m.ts > state.maxTs) state.maxTs = m.ts;
      continue;
    }
    const div = document.createElement("div");
    div.className = "msg" + (m.from === state.me ? " mine" : "");
    if (state.active.type === "group" && m.from !== state.me) {
      const who = document.createElement("div");
      who.className = "who";
      who.textContent = m.from;
      div.appendChild(who);
    }
    const body = document.createElement("div");
    body.className = "body";
    const time = document.createElement("div");
    time.className = "time";
    const t = document.createElement("span");
    t.textContent = fmtTime(m.ts);
    time.appendChild(t);
    if (m.from === state.me) {
      const del = document.createElement("button");
      del.type = "button";
      del.className = "del";
      del.textContent = "Delete";
      del.onclick = () => deleteMessage(m.key);
      time.prepend(del);
    }
    div.append(body, time);
    div.dataset.key = m.key;
    state.els.set(m.key, div);
    if (m.deleted) markDeleted(div);
    else if (m.image) {
      body.appendChild(makeMedia(state.active.id, m.image, m.text));
      if (m.text) { const c = document.createElement("div"); c.className = "caption"; c.textContent = m.text; body.appendChild(c); }
    } else body.textContent = m.text;
    box.appendChild(div);
    if (!state.lastKey || m.key > state.lastKey) state.lastKey = m.key;
    if (m.ts > state.maxTs) state.maxTs = m.ts;
  }
  if (added) refreshDayLabels();
  if (added && (nearBottom || list[list.length - 1].from === state.me)) box.scrollTop = box.scrollHeight;
}

// Keep the open chat in step with the server: membership changes, or being removed.
async function reconcileActive(chat, epoch) {
  if (!chat || state.active !== chat) return;
  const found = state.chats.find((c) => c.id === chat.id);
  if (found) {
    // `epoch` changes whenever we edit membership ourselves; a response that was already in flight
    // then predates our edit and must not overwrite it (the follow-up sync will carry the new state).
    if (epoch !== state.epoch) return;
    if (found.members.join(",") !== chat.members.join(",") || found.owner !== chat.owner) {
      Object.assign(chat, found); // mutate, so references to the open chat stay valid
      updateHeader();
    }
    return;
  }
  // Missing from the list: ask the server before closing, so one stale response can't kick anyone out.
  const gone = await fetch(`/api/chats/${encodeURIComponent(chat.id)}/messages?after=~`, { credentials: "same-origin", cache: "no-store" })
    .then((r) => r.status === 404).catch(() => false);
  if (gone && state.active === chat) {
    const name = chatLabel(chat);
    state.chats = state.chats.filter((c) => c.id !== chat.id);
    $("modalRoot").textContent = "";
    closeChat(`You're no longer in ${name}.`);
  }
}

// Tell the server how far we've read, but only while the tab is actually visible.
function markRead() {
  const chat = state.active;
  if (!chat || document.hidden || !state.maxTs) return;
  const upTo = state.maxTs;
  if ((state.readSent.get(chat.id) || 0) >= upTo) return;
  state.readSent.set(chat.id, upTo);
  api(`/chats/${encodeURIComponent(chat.id)}/read`, { method: "POST", body: { upTo } })
    .catch(() => state.readSent.delete(chat.id)); // retry on the next sync
}

function markDeleted(div) {
  div.classList.add("deleted");
  div.querySelector(".body").textContent = "Message deleted";
  div.querySelector(".del")?.remove();
}

function applyDeleted(suffixes) {
  for (const s of suffixes) {
    const el = state.els.get(`msg/${state.active.id}/${s}`);
    if (el && !el.classList.contains("deleted")) markDeleted(el);
  }
}

async function deleteMessage(key) {
  const chat = state.active;
  if (!chat || !confirm("Delete this message for everyone?")) return;
  try {
    await api(`/chats/${encodeURIComponent(chat.id)}/messages/${key.split("/").pop()}`, { method: "DELETE" });
    const el = state.els.get(key);
    if (el && state.active === chat) markDeleted(el);
    poke();
  } catch (e) { alert(e.message); }
}

function applyMessages(messages, wasInitial) {
  if (messages.length) {
    $("noMsgs")?.remove();
    appendMessages(messages);
    if (wasInitial) $("messages").scrollTop = $("messages").scrollHeight;
  } else if (wasInitial && !$("noMsgs")) {
    const p = document.createElement("div");
    p.className = "placeholder";
    p.id = "noMsgs";
    p.textContent = "No messages yet. Say hi!";
    $("messages").appendChild(p);
  }
}

/* One request does it all: chat list + new messages for the open chat.
   When nothing changed the server answers 204 with no body. */
async function runSync(force) {
  const chat = state.active;
  const epoch = state.epoch;
  const wasInitial = !state.lastKey;
  try {
    const p = new URLSearchParams();
    if (!force && state.version) p.set("v", state.version);
    if (chat) {
      p.set("chat", chat.id);
      p.set("t", state.typingSig);
      if (state.lastKey) p.set("after", state.lastKey);
    }
    const res = await fetch("/api/sync?" + p, { credentials: "same-origin", cache: "no-store" });
    if (res.status === 204) { state.idle++; return; }
    if (res.status === 401) { handleAuthError({ status: 401 }); return; }
    if (!res.ok) return;
    const d = await res.json();
    state.version = d.v;
    if (d.chats) { // absent when only the typing state changed
      state.idle = 0;
      state.chats = d.chats;
      renderChatList();
      await reconcileActive(chat, epoch);
      if (d.messages && state.active === chat) {
        applyMessages(d.messages, wasInitial);
        if (d.deleted) applyDeleted(d.deleted);
        markRead();
      }
    }
    if (d.typing && state.active === chat) showTyping(d.typing);
  } catch { /* network hiccup: try again on the next tick */ }
}

function sync(force = false) {
  if (!state.me) return Promise.resolve();
  if (state.syncing) { state.again = state.again || force; return state.syncing; }
  state.syncing = runSync(force).finally(() => {
    state.syncing = null;
    if (state.again) { state.again = false; sync(true); }
  });
  return state.syncing;
}

$("composer").onsubmit = async (e) => {
  e.preventDefault();
  const input = $("text");
  const text = input.value.trim();
  if (!text || !state.active) return;
  input.value = "";
  state.lastPing = 0; // sending ends "typing" on the server; the next keystroke starts a new ping
  try {
    await api(`/chats/${encodeURIComponent(state.active.id)}/messages`, { method: "POST", body: { text } });
    poke();
  } catch (err) { input.value = text; alert(err.message); }
};

function handleAuthError(e) {
  if (e.status === 401 && state.me) {
    stopPolling();
    state.me = null;
    $("app").classList.add("hidden");
    $("auth").classList.remove("hidden");
    setMode("login");
  }
}

/* ---------- polling (fast when visible, slow when hidden) ---------- */
// Fast (2s) right after activity, backing off to 10s when nothing is happening, 30s in a hidden tab.
function nextDelay() {
  if (document.hidden) return 30000;
  // With a chat open, don't back off past 4s: otherwise "typing…" would show up many seconds late.
  const cap = state.active ? 4000 : 10000;
  return Math.min(2000 * 2 ** Math.floor(state.idle / 5), cap);
}
function schedule() {
  clearTimeout(state.timer);
  if (!state.me) return;
  state.timer = setTimeout(async () => { await sync(); schedule(); }, nextDelay());
}
// Sync right now (forced) and go back to the fast polling rate.
function poke() {
  state.idle = 0;
  sync(true);
  schedule();
}
function startPolling() { state.version = ""; poke(); }
function stopPolling() { clearTimeout(state.timer); state.version = ""; }
document.addEventListener("visibilitychange", () => {
  if (!state.me) return;
  renderChatList();
  if (!document.hidden) { refreshDayLabels(); markRead(); poke(); }
});
// Tell the server I'm typing: at most one ping per 2.5s, and a "stopped" ping when the box is emptied.
function sendTyping(chat, on) {
  api(`/chats/${encodeURIComponent(chat.id)}/typing`, { method: "POST", body: { typing: on } }).catch(() => {});
}
$("text").addEventListener("input", () => {
  state.idle = 0;
  const chat = state.active;
  if (!chat) return;
  if (!$("text").value.trim()) {
    if (state.lastPing) { state.lastPing = 0; sendTyping(chat, false); }
    return;
  }
  const now = Date.now();
  if (now - state.lastPing > 2500) { state.lastPing = now; sendTyping(chat, true); }
});

/* ---------- photos ---------- */
const IMG_FULL_EDGE = 1600, IMG_THUMB_EDGE = 480, IMG_MAX = 3 * 1024 * 1024, THUMB_MAX = 300 * 1024, IMG_INPUT_MAX = 40 * 1024 * 1024;
const imgUrl = (chatId, id, full) => `/api/chats/${encodeURIComponent(chatId)}/images/${id}${full ? "?size=full" : ""}`;

// Size in the conversation: reserve the exact space before the picture arrives, so the page never jumps.
function makeMedia(chatId, im, caption) {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "media";
  btn.setAttribute("aria-label", caption ? "Open photo: " + caption : "Open photo");
  const k = Math.min(1, 300 / im.w, 360 / im.h);
  btn.style.width = Math.max(60, Math.round(im.w * k)) + "px";
  btn.style.aspectRatio = `${im.w} / ${im.h}`;
  const img = new Image();
  img.alt = caption || "Photo";
  img.loading = "lazy";
  img.decoding = "async";
  img.onerror = () => {
    btn.className = "media broken";
    btn.removeAttribute("style");
    btn.disabled = true;
    btn.replaceChildren(document.createTextNode("Photo unavailable"));
  };
  img.src = imgUrl(chatId, im.id, false);
  btn.appendChild(img);
  btn.onclick = () => openLightbox(chatId, im, caption);
  return btn;
}

function openLightbox(chatId, im, caption) {
  const ov = document.createElement("div");
  ov.className = "lightbox";
  const img = new Image();
  img.alt = caption || "Photo";
  img.src = imgUrl(chatId, im.id, true);
  const x = document.createElement("button");
  x.type = "button"; x.className = "x"; x.textContent = "×"; x.setAttribute("aria-label", "Close");
  ov.append(img, x);
  if (caption) { const c = document.createElement("div"); c.className = "cap"; c.textContent = caption; ov.appendChild(c); }
  const close = () => { ov.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = (e) => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  ov.onclick = close;
  $("modalRoot").appendChild(ov);
}

const canvasBlob = (cv, q) => new Promise((res, rej) => cv.toBlob((b) => (b ? res(b) : rej(new Error("Couldn't process that image."))), "image/jpeg", q));

async function decodeImage(file) {
  if (window.createImageBitmap) { try { return await createImageBitmap(file); } catch { /* fall back below */ } }
  const url = URL.createObjectURL(file);
  try {
    return await new Promise((res, rej) => {
      const im = new Image();
      im.onload = () => res(im);
      im.onerror = () => rej(new Error("That file can't be read as an image."));
      im.src = url;
    });
  } finally { URL.revokeObjectURL(url); }
}

// Draw into a canvas and re-encode as JPEG: this shrinks the photo and drops its hidden metadata
// (camera, location). Quality, then size, step down until it fits under the cap.
async function renderJpeg(src, sw, sh, maxEdge, maxBytes, q) {
  let scale = Math.min(1, maxEdge / Math.max(sw, sh));
  for (let i = 0; i < 10; i++) {
    const w = Math.max(1, Math.round(sw * scale)), h = Math.max(1, Math.round(sh * scale));
    const cv = document.createElement("canvas");
    cv.width = w; cv.height = h;
    const cx = cv.getContext("2d");
    cx.fillStyle = "#fff"; cx.fillRect(0, 0, w, h); // transparent PNGs become white, not black
    cx.drawImage(src, 0, 0, w, h);
    const blob = await canvasBlob(cv, q);
    if (blob.size <= maxBytes) return { blob, w, h };
    if (q > 0.55) q -= 0.12; else scale *= 0.8;
  }
  throw new Error("That image is too large to send.");
}

async function prepareImage(file) {
  if (file.type && !file.type.startsWith("image/")) throw new Error("Only images can be sent.");
  if (file.size > IMG_INPUT_MAX) throw new Error("That file is too big (40 MB maximum).");
  const src = await decodeImage(file);
  const sw = src.naturalWidth || src.width, sh = src.naturalHeight || src.height;
  if (!sw || !sh) throw new Error("That file can't be read as an image.");
  const thumb = await renderJpeg(src, sw, sh, IMG_THUMB_EDGE, THUMB_MAX, 0.8);
  let full, w, h;
  if (file.type === "image/gif") { // keep the animation as-is
    if (file.size > IMG_MAX) throw new Error("That GIF is bigger than 3 MB.");
    full = file; w = sw; h = sh;
  } else {
    const r = await renderJpeg(src, sw, sh, IMG_FULL_EDGE, IMG_MAX, 0.85);
    full = r.blob; w = r.w; h = r.h;
  }
  if (src.close) src.close();
  return { full, thumb: thumb.blob, w, h };
}

// XHR rather than fetch, because it reports upload progress.
function uploadImage(chatId, p, text, onProgress) {
  let xhr;
  const promise = new Promise((resolve, reject) => {
    const fd = new FormData();
    fd.set("image", p.full, "photo");
    fd.set("thumb", p.thumb, "thumb.jpg");
    fd.set("w", String(p.w));
    fd.set("h", String(p.h));
    if (text) fd.set("text", text);
    xhr = new XMLHttpRequest();
    xhr.open("POST", `/api/chats/${encodeURIComponent(chatId)}/images`);
    xhr.withCredentials = true;
    xhr.upload.onprogress = (e) => { if (e.lengthComputable) onProgress(e.loaded / e.total); };
    xhr.onload = () => {
      let data = {};
      try { data = JSON.parse(xhr.responseText); } catch { /* not JSON */ }
      if (xhr.status >= 200 && xhr.status < 300) return resolve(data);
      const e = new Error(data.error || (xhr.status === 413 ? "That image is too large." : "Upload failed."));
      e.status = xhr.status;
      reject(e);
    };
    xhr.onerror = () => reject(new Error("Network problem. Check your connection and try again."));
    xhr.onabort = () => reject(new Error("Cancelled."));
    xhr.send(fd);
  });
  return { promise, abort: () => xhr && xhr.abort() };
}

function pickImage(file) {
  const chat = state.active;
  if (!chat || !file || $("modalRoot").querySelector(".overlay")) return;
  openModal((modal, close) => {
    const overlay = modal.parentNode;
    let prepared = null, busy = false, upload = null, previewUrl = null;
    const h2 = document.createElement("h2");
    h2.textContent = "Send photo";
    const slot = document.createElement("div");
    const note = document.createElement("div");
    note.className = "photo-note";
    note.textContent = "Preparing…";
    const caption = document.createElement("input");
    caption.type = "text"; caption.placeholder = "Add a caption (optional)"; caption.maxLength = 500; caption.autocomplete = "off";
    const bar = document.createElement("div");
    bar.className = "bar hidden";
    const fill = document.createElement("i");
    bar.appendChild(fill);
    const row = document.createElement("div");
    row.className = "row-end";
    const cancel = document.createElement("button");
    cancel.type = "button"; cancel.className = "btn ghost"; cancel.textContent = "Cancel";
    const send = document.createElement("button");
    send.type = "button"; send.className = "btn"; send.textContent = "Send"; send.disabled = true;
    row.append(cancel, send);
    modal.append(h2, slot, note, caption, bar, row);

    const done = () => { if (previewUrl) URL.revokeObjectURL(previewUrl); close(); };
    cancel.onclick = () => { if (upload) upload.abort(); done(); };
    overlay.onclick = (e) => { if (e.target === overlay && !busy) done(); }; // don't lose an upload by a stray click

    const go = async () => {
      if (!prepared || busy) return;
      busy = true; send.disabled = true; caption.disabled = true;
      note.className = "photo-note"; note.textContent = "Sending…";
      bar.classList.remove("hidden"); fill.style.width = "0";
      upload = uploadImage(chat.id, prepared, caption.value.trim(), (f) => { fill.style.width = Math.round(f * 100) + "%"; });
      try {
        await upload.promise;
        state.lastPing = 0;
        done();
        if (state.active === chat) poke();
      } catch (err) {
        busy = false; upload = null; send.disabled = false; caption.disabled = false;
        bar.classList.add("hidden");
        if (err.status === 401) { done(); handleAuthError(err); return; }
        note.className = "photo-note err";
        note.textContent = err.message;
        send.textContent = "Try again";
      }
    };
    send.onclick = go;
    caption.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); go(); } };

    prepareImage(file).then((p) => {
      if (!overlay.isConnected) return;
      prepared = p;
      previewUrl = URL.createObjectURL(p.thumb);
      const im = new Image();
      im.className = "photo-preview"; im.alt = "Preview"; im.src = previewUrl;
      slot.appendChild(im);
      const kb = Math.max(1, Math.round(p.full.size / 1024));
      note.textContent = `${p.w} × ${p.h}, ${kb >= 1024 ? (kb / 1024).toFixed(1) + " MB" : kb + " KB"}`;
      send.disabled = false;
      caption.focus();
    }).catch((err) => { note.className = "photo-note err"; note.textContent = err.message; });
  });
}

$("attachBtn").onclick = () => $("fileInput").click();
$("fileInput").onchange = (e) => { const f = e.target.files[0]; e.target.value = ""; if (f) pickImage(f); };
$("text").addEventListener("paste", (e) => {
  const f = [...(e.clipboardData?.files || [])].find((x) => x.type.startsWith("image/"));
  if (f) { e.preventDefault(); pickImage(f); }
});
const hasFiles = (e) => e.dataTransfer && [...e.dataTransfer.types].includes("Files");
const mainEl = document.querySelector("main");
let dragDepth = 0;
mainEl.addEventListener("dragenter", (e) => { if (hasFiles(e) && state.active) { dragDepth++; mainEl.classList.add("dropping"); } });
mainEl.addEventListener("dragover", (e) => { if (hasFiles(e) && state.active) e.preventDefault(); });
mainEl.addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; mainEl.classList.remove("dropping"); } });
mainEl.addEventListener("drop", (e) => {
  if (!hasFiles(e)) return;
  e.preventDefault(); dragDepth = 0; mainEl.classList.remove("dropping");
  const f = [...e.dataTransfer.files].find((x) => x.type.startsWith("image/"));
  if (f && state.active) pickImage(f);
});

/* ---------- modals ---------- */
function openModal(build) {
  const root = $("modalRoot");
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  const modal = document.createElement("div");
  modal.className = "modal";
  overlay.appendChild(modal);
  const close = () => overlay.remove();
  overlay.onclick = (e) => { if (e.target === overlay) close(); };
  build(modal, close);
  root.appendChild(overlay);
  return close;
}

function userPicker(onPick, excluded = () => [], label = "Select") {
  const wrap = document.createElement("div");
  const input = document.createElement("input");
  input.type = "text"; input.placeholder = "Search username"; input.autocapitalize = "none";
  const results = document.createElement("div");
  results.className = "results";
  let t;
  input.oninput = () => {
    clearTimeout(t);
    t = setTimeout(async () => {
      const q = input.value.trim();
      if (!q) { results.textContent = ""; return; }
      try {
        const { users } = await api("/users?q=" + encodeURIComponent(q));
        results.textContent = "";
        const shown = users.filter((u) => !excluded().includes(u));
        if (!shown.length) { const n = document.createElement("div"); n.className = "empty"; n.textContent = "No users found."; results.appendChild(n); }
        for (const u of shown) {
          const r = document.createElement("div");
          r.className = "result";
          const s = document.createElement("span"); s.textContent = "@" + u;
          const b = document.createElement("button"); b.className = "btn"; b.type = "button"; b.style.padding = "4px 10px"; b.textContent = label;
          b.onclick = () => onPick(u);
          r.append(s, b);
          results.appendChild(r);
        }
      } catch (e) { handleAuthError(e); }
    }, 250);
  };
  wrap.append(input, results);
  return { el: wrap, input };
}

/* ---------- group members ---------- */
$("infoBtn").onclick = () => {
  const chat = state.active;
  if (!chat || chat.type !== "group") return;
  openModal((modal, close) => {
    const mk = (tag, cls, text) => {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text != null) e.textContent = text;
      return e;
    };
    let error = "";
    const base = `/chats/${encodeURIComponent(chat.id)}/members`;
    const act = async (fn) => {
      error = "";
      try { await fn(); } catch (e) { error = e.message; }
      render();
    };
    const applyChange = (r) => { state.epoch++; Object.assign(chat, r.chat); updateHeader(); poke(); };

    const render = () => {
      modal.textContent = "";
      const isOwner = chat.owner === state.me;
      modal.append(mk("h2", "", chat.name), mk("div", "sub-note", `${chat.members.length} members`));

      const list = mk("div", "results");
      for (const u of chat.members) {
        const row = mk("div", "result");
        const label = mk("span", "", "@" + u + (u === state.me ? " (you)" : ""));
        if (u === chat.owner) label.append(" ", mk("span", "tag", "owner"));
        row.appendChild(label);
        if (isOwner && u !== state.me) {
          const rm = mk("button", "btn ghost", "Remove");
          rm.type = "button";
          rm.style.padding = "4px 10px";
          rm.onclick = () => {
            if (!confirm(`Remove @${u} from the group?`)) return;
            act(async () => applyChange(await api(`${base}/${u}`, { method: "DELETE" })));
          };
          row.appendChild(rm);
        }
        list.appendChild(row);
      }
      modal.appendChild(list);

      modal.appendChild(mk("h3", "", "Add people"));
      const picker = userPicker(
        (u) => act(async () => applyChange(await api(base, { method: "POST", body: { add: [u] } }))),
        () => chat.members,
        "Add"
      );
      modal.appendChild(picker.el);
      if (error) modal.appendChild(mk("div", "err", error));

      const row = mk("div", "row");
      const leave = mk("button", "btn danger", "Leave group");
      leave.type = "button";
      leave.onclick = () => {
        if (!confirm("Leave this group?")) return;
        act(async () => {
          await api(`${base}/${state.me}`, { method: "DELETE" });
          state.chats = state.chats.filter((c) => c.id !== chat.id);
          close();
          closeChat();
          poke();
        });
      };
      const done = mk("button", "btn ghost", "Close");
      done.type = "button";
      done.onclick = close;
      row.append(leave, done);
      modal.appendChild(row);
    };
    render();
  });
};

/* ---------- settings ---------- */
const THEME_CHOICES = [["system", "System"], ["light", "Light"], ["dark", "Dark"], ["custom", "Custom"]];
const ACCENT_CHOICES = [["green", "Green"], ["blue", "Blue"], ["purple", "Purple"], ["rose", "Rose"], ["orange", "Orange"], ["slate", "Slate"]];
const WALLPAPER_CHOICES = [["none", "None"], ["tint", "Tint"], ["dots", "Dots"], ["grid", "Grid"], ["stripes", "Stripes"]];
const RAINBOW = "conic-gradient(#e5484d, #f5a524, #46a758, #3e63dd, #8e4ec6, #e5484d)";

$("settingsBtn").onclick = () => openModal((modal, close) => {
  const mk = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  };
  const status = mk("div", "sub-note", "Changes apply instantly and are saved to your account.");
  const editing = { theme: false, accent: false }; // a "Custom" editor opened before any colour was chosen
  const refreshers = [];
  const refreshAll = () => refreshers.forEach((f) => f());
  let timer;

  // Apply right away; save to the account a moment later (rapid changes make one request).
  const setPrefs = (patch) => {
    applyPrefs({ ...state.prefs, ...patch });
    status.textContent = "Saving…";
    clearTimeout(timer);
    timer = setTimeout(async () => {
      try { await api("/settings", { method: "PUT", body: state.prefs }); status.textContent = "Saved to your account."; }
      catch (e) { status.textContent = "Couldn't save: " + e.message; }
    }, 300);
    refreshAll();
  };

  // A colour box: native picker + a text field that understands hex, rgb() and hsl().
  const colorEditor = (kind) => {
    const key = kind === "accent" ? "customAccent" : "customTheme";
    const wrap = mk("div", "color-editor");
    const row = mk("div", "color-row");
    const picker = mk("input");
    picker.type = "color";
    picker.setAttribute("aria-label", kind === "accent" ? "Pick an accent color" : "Pick a theme color");
    const text = mk("input");
    text.type = "text";
    text.placeholder = "#2f6f5e   rgb(47, 111, 94)   hsl(164, 41%, 31%)";
    text.setAttribute("aria-label", kind === "accent" ? "Accent color as hex, rgb or hsl" : "Theme color as hex, rgb or hsl");
    text.spellcheck = false; text.autocomplete = "off"; text.autocapitalize = "none";
    const msg = mk("div", "color-msg");
    msg.setAttribute("aria-live", "polite");
    row.append(picker, text);
    wrap.append(row, msg);
    let invalid = "", errTimer;

    const apply = (hex) => setPrefs(kind === "accent" ? { accent: "custom", customAccent: hex } : { theme: "custom", customTheme: hex });
    text.addEventListener("input", () => {
      clearTimeout(errTimer);
      const v = text.value.trim();
      if (!v) { invalid = ""; refreshAll(); return; }
      const res = parseColor(v);
      if (res.error) {
        // Half-typed values are normal ("#2f6f5"), so only complain once typing pauses.
        errTimer = setTimeout(() => { invalid = res.error; refreshAll(); }, 700);
        return;
      }
      invalid = "";
      apply(toHex(res.rgb));
    });
    text.addEventListener("blur", () => {
      clearTimeout(errTimer);
      const v = text.value.trim();
      if (v) { const res = parseColor(v); invalid = res.error || ""; refreshAll(); }
    });
    picker.addEventListener("input", () => { invalid = ""; text.value = picker.value; apply(picker.value); });

    refreshers.push(() => {
      const P = state.prefs, hex = P[key];
      const active = P[kind === "accent" ? "accent" : "theme"] === "custom";
      wrap.classList.toggle("hidden", !(active || editing[kind]));
      if (document.activeElement !== text && !invalid) text.value = hex || "";
      if (hex) picker.value = hex;
      if (invalid) { msg.textContent = invalid; msg.className = "color-msg bad"; return; }
      msg.className = "color-msg";
      if (!hex) { msg.textContent = "Type a color in hex, rgb or hsl, or use the picker."; return; }
      const lines = [describeColor(hexToRgb(hex))];
      if (active) {
        const note = kind === "accent" ? state.lookInfo.accentNote : state.lookInfo.themeShifted ? `Shifted to ${state.lookInfo.themeShifted} so text stays readable.` : null;
        if (note) lines.push(note);
      }
      msg.textContent = lines.join("\n");
    });
    return { el: wrap, text };
  };

  modal.appendChild(mk("h2", "", "Appearance"));

  // ---- theme ----
  modal.appendChild(mk("h3", "", "Theme"));
  const themes = mk("div", "seg-row");
  const themeEditor = colorEditor("theme");
  for (const [value, label] of THEME_CHOICES) {
    const b = mk("button", "seg", label);
    b.type = "button";
    b.onclick = () => {
      if (value === "custom" && !state.prefs.customTheme) { editing.theme = true; refreshAll(); themeEditor.text.focus(); return; }
      editing.theme = false;
      setPrefs({ theme: value });
    };
    refreshers.push(() => b.setAttribute("aria-pressed", String(state.prefs.theme === value)));
    themes.appendChild(b);
  }
  modal.append(themes, themeEditor.el);

  // ---- accent ----
  modal.appendChild(mk("h3", "", "Accent color"));
  const accents = mk("div", "seg-row");
  const accentEditor = colorEditor("accent");
  for (const [value, label] of ACCENT_CHOICES) {
    const b = mk("button", "swatch");
    b.type = "button";
    b.dataset.accent = value;
    b.title = label;
    b.setAttribute("aria-label", label);
    b.onclick = () => { editing.accent = false; setPrefs({ accent: value }); };
    refreshers.push(() => b.setAttribute("aria-pressed", String(state.prefs.accent === value)));
    accents.appendChild(b);
  }
  const custom = mk("button", "swatch");
  custom.type = "button";
  custom.title = "Custom color";
  custom.setAttribute("aria-label", "Custom color");
  custom.onclick = () => {
    if (!state.prefs.customAccent) { editing.accent = true; refreshAll(); accentEditor.text.focus(); return; }
    editing.accent = false;
    setPrefs({ accent: "custom" });
  };
  refreshers.push(() => {
    custom.style.background = state.prefs.customAccent || RAINBOW; // inline, so it always shows the colour itself
    custom.setAttribute("aria-pressed", String(state.prefs.accent === "custom"));
  });
  accents.appendChild(custom);
  modal.append(accents, accentEditor.el);

  // ---- wallpaper ----
  modal.appendChild(mk("h3", "", "Chat wallpaper"));
  const walls = mk("div", "seg-row");
  for (const [value, label] of WALLPAPER_CHOICES) {
    const b = mk("button", "wp-cell");
    b.type = "button";
    const tile = mk("span", "wp-tile");
    tile.dataset.wp = value;
    b.append(tile, mk("span", "", label));
    b.onclick = () => setPrefs({ wallpaper: value });
    refreshers.push(() => b.setAttribute("aria-pressed", String(state.prefs.wallpaper === value)));
    walls.appendChild(b);
  }
  modal.appendChild(walls);

  const install = installSection(mk);
  if (install) modal.appendChild(install);

  modal.appendChild(status);
  const row = mk("div", "row");
  const done = mk("button", "btn", "Done");
  done.type = "button";
  done.onclick = close;
  row.appendChild(done);
  modal.appendChild(row);
  refreshAll();
});

/* ---------- installable app ---------- */
const isStandalone = () => (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
let installPrompt = null; // Chrome/Edge/Android hand us this when the site can be installed
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installPrompt = e; });
window.addEventListener("appinstalled", () => { installPrompt = null; });
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
}
// Settings calls this to add its "Install app" section (nothing is shown inside the installed app).
function installSection(mk) {
  if (isStandalone()) return null;
  const wrap = mk("div");
  wrap.appendChild(mk("h3", "", "App"));
  if (installPrompt) {
    const b = mk("button", "btn ghost", "Install app");
    b.type = "button";
    b.onclick = async () => {
      const ev = installPrompt;
      installPrompt = null;
      b.disabled = true;
      try { await ev.prompt(); await ev.userChoice; } catch {}
      wrap.remove();
    };
    wrap.append(b, mk("p", "install-hint", "Opens in its own window, with an icon on your home screen or desktop."));
  } else if (isIOS()) {
    wrap.appendChild(mk("p", "install-hint", "To install: tap the Share button in Safari, then \u201cAdd to Home Screen\u201d."));
  } else {
    wrap.appendChild(mk("p", "install-hint", "To install, use your browser\u2019s menu: \u201cInstall app\u201d or \u201cAdd to Home screen\u201d."));
  }
  return wrap;
}

/* ---------- boot ---------- */
syncThemeColor();
(async () => {
  try {
    const { username, prefs } = await api("/me");
    startApp(username, prefs);
  } catch {
    $("auth").classList.remove("hidden");
    setMode("login");
  }
})();
</script>
